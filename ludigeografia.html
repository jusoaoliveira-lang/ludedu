<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Diário do Ludi: Micro-organismos</title>
<style>
:root{--y:#FFF4BD;--p:#F4B9B8;--m:#85D2D0;--r:#887BB0;--bg:#FFFBEA;--card:#fff;--tx:#3b3358;--ok:#2e9e8f;--bad:#d9667a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2540;--card:#3a3358;--tx:#fff4dd;--y:#5d5532;--p:#7a4f5c}}
:root[data-theme="dark"]{--bg:#2a2540;--card:#3a3358;--tx:#fff4dd;--y:#5d5532;--p:#7a4f5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:18px;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0}h2{font-size:22px;margin:6px 0}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 4px 0 rgba(136,123,176,.35)}
button{font:inherit;color:var(--tx);border:0;border-radius:18px;padding:14px 16px;background:var(--m);font-weight:700;width:100%;margin:6px 0;cursor:pointer;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.15)}
button:active{transform:translateY(2px)}
button.big{background:var(--r);color:#fff;text-align:center}
button.pink{background:var(--p)}
button.yel{background:var(--y)}
input{font:inherit;width:100%;padding:14px;border-radius:16px;border:3px solid var(--r);background:var(--card);color:var(--tx);margin:10px 0}
.ludi{display:block;margin:0 auto;width:150px}
.bubble{background:var(--y);border-radius:18px;padding:12px 14px;margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.top button{width:auto;padding:8px 12px}
.bar{height:12px;background:rgba(136,123,176,.25);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--r);transition:width .3s}
.ok{background:var(--ok)!important;color:#fff}.bad{background:var(--bad)!important;color:#fff}
.stars{font-size:28px;letter-spacing:2px}
.sm{font-size:15px;opacity:.85}
.row{display:flex;gap:8px}.row button{margin:8px 0 0}
</style>
</head>

domésticos e veículos têm maior durabilidade."], ["Qual indústria produz peças e ferramentas para outras indústrias?", ["bens intermediários", "indústrias de base", "bens não duráveis"], 0, "Bens intermediários produzem peças para outras indústrias."], ["Qual indústria transforma matéria-prima em produto semiacabado, como o aço?", ["indústrias de base", "bens duráveis", "bens intermediários"], 0, "Indústrias de base transformam a matéria-prima em semiacabado."]]}, {n: "Indústrias por região", e: "🏙️", "q": [["Qual é a região mais industrializada do Brasil?", ["Norte", "Sudeste", "Sul"], 1, "O Sudeste é a região mais industrializada do Brasil."], ["A Zona Franca de Manaus fica no estado do:", ["Pará", "Amazonas", "Acre"], 1, "A Zona Franca de Manaus fica no Amazonas."], ["Em Salvador (BA), o destaque industrial é o setor:", ["têxtil", "petroquímico", "calçadista"], 1, "Em Salvador, o destaque industrial é o setor petroquímico."]]}, {n: "Agricultura por região", e: "🌽", "q": [["Os frigoríficos se destacam em Mato Grosso e Mato Grosso do Sul, na região:", ["Sul", "Centro-Oeste", "Nordeste"], 1, "Os frigoríficos se destacam no Centro-Oeste."], ["A agricultura familiar do Norte produz muito de:", ["mandioca", "uva", "trigo"], 0, "A agricultura familiar do Norte produz muita mandioca."], ["Qual região concentra quase metade dos trabalhadores agrícolas do Brasil?", ["Nordeste", "Sul", "Norte"], 0, "Quase metade dos trabalhadores agrícolas do Brasil está no Nordeste."], ["O maior produtor brasileiro de soja é:", ["Mato Grosso", "Paraná", "Bahia"], 0, "O Mato Grosso é o maior produtor brasileiro de soja."], ["Na pecuária intensiva, o gado:", ["é criado solto no pasto", "é tratado em local fechado, com ração e técnicas modernas", "vive no sertão sem cuidados"], 1, "Na pecuária intensiva, o gado é tratado em local fechado."]]}, {n: "A pecuária", e: "🐮", "q": [["Qual rebanho é o maior no Norte?", ["bovinos", "búfalos", "caprinos"], 1, "O Norte tem o maior rebanho de búfalos."], ["A maior criação de caprinos do país está na região:", ["Sul", "Nordeste", "Sudeste"], 1, "O Nordeste tem o maior rebanho de caprinos."], ["O Paraná é o maior produtor e exportador de:", ["frangos", "suínos", "ovinos"], 0, "O Paraná é o maior produtor e exportador de frangos."], ["Qual cultura é típica da monocultura comercial no Sul?", ["soja", "juta", "pimenta-do-reino"], 0, "A monocultura comercial de soja é comum no Sul."]]}], ST: [[["🌾", "O que é agropecuária?", "A <b>agricultura</b> (plantar) e a <b>pecuária</b> (criar animais) formam a <b>agropecuária</b>. O Brasil se destaca nisso no mundo todo."], ["🏭", "Agroindústria", "A combinação entre as atividades agropecuárias e as indústrias é chamada de <b>agroindústria</b>. Ela <b>processa</b> os produtos do campo."], ["🧪", "Por que produzimos tanto?", "Solo fértil, clima e relevo plano facilitam a <b>mecanização</b> e a criação de animais. Pesquisas e tecnologias aumentam a <b>produtividade</b>."], ["🌳", "Lavoura permanente", "<b>Permanece</b> após a colheita e pode produzir de novo sem replantar. Ex.: café, laranja, erva-mate, uva, banana e maçã."], ["🌱", "Lavoura temporária", "É <b>plantada todo ano</b>, depois da colheita. Ex.: soja, milho, trigo, arroz e cana-de-açúcar."], ["🦎", "Desafio do Ludi", "Agro + indústria = ? Uma atividade que junta plantar e processar. <b>Agroindústria!</b>"]], [["🎋", "Matéria-prima", "A <b>cana-de-açúcar</b> é a principal matéria-prima do etanol brasileiro. Ela é plantada, cortada e levada de caminhão até a usina."], ["🚿", "Lavar e cortar", "Na esteira, <b>jatos de água</b> tiram terra e areia. Depois a cana é <b>cortada em pedacinhos</b> para facilitar a moagem."], ["⚙️", "Moagem", "Rolos trituradores <b>moem a cana</b> várias vezes e extraem o <b>caldo</b>, que tem o açúcar. O <b>bagaço</b> é totalmente aproveitado: parte vira energia para a usina, e a sobra é vendida."], ["🧴", "Caldo e fermento", "O caldo é peneirado e descansa. O que sobra no fundo é um <b>lodo</b>, que serve de adubo. Depois ele é misturado a um <b>fermento de micro-organismos</b>, que libera gás carbônico e álcool."], ["🫧", "Fermentação", "Em até <b>12 horas</b>, a fermentação gera o <b>vinho fermentado</b>, um produto quente. Ele é resfriado com água corrente."], ["🔥", "Destilação", "O vinho é aquecido até <b>evaporar</b> e depois condensado de volta ao líquido. Assim, os componentes são <b>separados</b>."], ["⛽", "Do tanque ao posto", "O <b>etanol hidratado</b> vai para os postos. Parte passa por desidratação e vira <b>etanol anidro</b>, misturado à <b>gasolina</b> como aditivo."], ["🦎", "Desafio do Ludi", "Qual é a matéria-prima do etanol? <b>Cana-de-açúcar!</b> E o bagaço vira o quê? <b>Energia!</b>"]], [["📦", "Antes: tudo vinha de fora", "Até meados do século XIX, os produtos industrializados consumidos no Brasil eram <b>importados</b>, principalmente da <b>Europa</b>."], ["☕", "O café muda tudo", "Por volta de 1840, o Brasil virou o <b>maior produtor mundial de café</b>. O dinheiro acumulado ajudou a instalar <b>indústrias</b> no país."], ["🏙️", "Onde começaram", "As primeiras indústrias ficaram no <b>Sudeste</b>, em São Paulo e no Rio de Janeiro, perto da infraestrutura e do mercado consumidor."], ["⏳", "Indústria recente", "Comparado a outros países, o Brasil tem uma <b>industrialização recente</b>."]], [["🧺", "Bens não duráveis", "Produzem mercadorias que <b>se esgotam</b> quando consumidas: alimentos, bebidas, higiene e limpeza."], ["🛋️", "Bens duráveis", "Produzem mercadorias de <b>maior durabilidade</b>: eletrodomésticos, eletroeletrônicos, móveis e veículos."], ["🔧", "Bens intermediários", "Produzem <b>equipamentos e peças</b> para outras indústrias: peças de carro, ferramentas e máquinas."], ["⛏️", "Indústrias de base", "Transformam a matéria-prima em um <b>produto semiacabado</b>. Ex.: refinarias e siderúrgicas, que fabricam <b>aço</b> e <b>ferro fundido</b>."]], [["🏙️", "Sudeste", "A região <b>mais industrializada</b>. Destaques: <b>automobilístico</b> (SP), <b>siderúrgico</b>, <b>petroquímico</b>, <b>naval</b> (RJ) e <b>petrolífero</b> (RJ e ES)."], ["🧣", "Sul", "Indústrias <b>diversificadas</b> e bem distribuídas. Destaques: setor <b>alimentício</b> e de <b>vestuário</b>."], ["🐄", "Centro-Oeste", "Muitas <b>agroindústrias</b>: <b>frigoríficos</b> (MT e MS), <b>óleos vegetais</b> e <b>fertilizantes</b> (MT), e <b>medicamentos, vestuário e calçados</b> (GO)."], ["📺", "Norte", "Pouco expressivas, mas a <b>Zona Franca de Manaus</b> (AM) tem montadoras de <b>televisores, celulares, computadores, bicicletas e relógios</b>."], ["🌊", "Nordeste", "Recife (PE): <b>têxteis</b> e <b>alimentícios</b>. Salvador (BA): <b>petrolífero</b> e <b>petroquímico</b>, no Polo de Camaçari."]], [["🎋", "Sudeste", "Grandes investimentos em <b>tecnologia</b> e solos férteis. É a maior produtora de <b>cana-de-açúcar, café e laranja</b>. SP é a maior produtora de cana do país."], ["🍠", "Norte", "A <b>agricultura familiar</b> responde por mais da metade da produção. Destaques: <b>mandioca, milho, arroz e feijão</b>. A soja é a cultura comercial."], ["🧵", "Nordeste", "A cana ainda é a principal. Algodão (CE, PB, RN) e soja (BA, MA) são para exportação. Na <b>subsistência</b>: feijão, mandioca e arroz, com pouca produtividade."], ["🥭", "Frutas irrigadas", "No <b>Vale do São Francisco</b> (BA) e no Vale do Açu (RN), grandes produtores irrigam as plantações e exportam <b>frutas</b>, como a manga."], ["🌾", "Centro-Oeste", "Soja, milho, algodão e cana estão entre os mais cultivados. A região produz cerca de <b>50% dos grãos</b> do país. O <b>Mato Grosso</b> é o maior produtor de soja."], ["🧉", "Sul", "A <b>policultura</b> é forte nas pequenas propriedades familiares. A <b>monocultura comercial</b> de soja, milho, trigo, laranja e café é comum na região."]], [["🐮", "O que é pecuária?", "Criação de animais para produzir <b>alimentos</b> (carne, leite, ovos, mel) e <b>matéria-prima</b> para indústrias (couro, lã, seda)."], ["🌿", "Pecuária extensiva", "O gado é <b>solto</b> e come o que tem no pasto. Usa <b>técnicas simples</b>."], ["🏭", "Pecuária intensiva", "O gado fica <b>em local fechado</b>, com ração e pastagem cultivada, e usa <b>técnicas modernas</b>."], ["🏜️", "Fundo de pasto", "No sertão nordestino, as <b>comunidades de fundo de pasto</b> criam cabras, bodes e ovelhas soltos. As terras são de uso comunitário e preservam culturas de povos tradicionais."], ["🐔", "Rebanhos", "<b>Galinhas</b> são o maior número de cabeças. Os <b>bovinos</b> estão mais no Centro-Oeste, e <b>Mato Grosso</b> é o maior criador."], ["🐃", "Mais rebanhos", "<b>Norte</b>: maior rebanho de <b>búfalos</b>. <b>Sul</b>: maior rebanho de <b>suínos</b>, e o <b>Paraná</b> é o maior produtor e exportador de frangos. <b>Nordeste</b>: maior rebanho de <b>caprinos</b>."], ["🦎", "Desafio do Ludi", "Qual região tem o maior rebanho de caprinos? <b>Nordeste!</b>"]]], RES: ["A combinação de agropecuária com indústria é a <b>agroindústria</b>.", "Lavoura <b>permanente</b> permanece após a colheita; a <b>temporária</b> é plantada todo ano.", "A <b>cana-de-açúcar</b> é a principal matéria-prima do etanol brasileiro.", "O <b>bagaço</b> é queimado para gerar energia; o lodo vira adubo.", "Na <b>destilação</b>, os componentes do vinho são separados. O etanol anidro vai para a gasolina.", "Até meados do século XIX, os produtos industrializados vinham principalmente da Europa.", "Bens <b>não duráveis</b> se esgotam; bens <b>duráveis</b> duram mais.", "Bens <b>intermediários</b> fazem peças para outras indústrias; as de <b>base</b> transformam a matéria-prima.", "O <b>Sudeste</b> é a região mais industrializada. O Nordeste tem o maior rebanho de caprinos.", "O Centro-Oeste produz cerca de 50% dos grãos. O <b>Norte</b> tem o maior rebanho de búfalos. Parabéns, explorador!"]}
];
var S={name:"",best:{},studied:{}},app=document.getElementById("app"),SB,PH,RES,ST,cur;

SUBJ.forEach(function(m,k){var t=m.PH.length*3,g=0;m.PH.forEach(function(p,i){g+=S.best[m.id+"_"+i]||0});
h+='<button class="'+(k%2?'pink':'')+'" onclick="mat('+k+')">'+m.e+' '+m.n+'<br><span class="sm">'+m.cap+' · '+g+'/'+t+' ⭐</span></button>'});
h+='<button class="big" onclick="invite()">📲 Convidar amigos</button><p class="sm" style="text-align:center">Cada amigo digita o próprio nome ao abrir o convite.</p>';show(h)}
function chg(){S.name="";save();welcome()}
function mat(k){SB=SUBJ[k];PH=SB.PH;RES=SB.RES;ST=SB.ST;mapa()}
function mapa(){var h='<div class="top"><button class="yel" onclick="home()">← Matérias</button><span>'+SB.e+' '+SB.n+'</span></div>'+LUDI+'<div class="bubble">'+esc(S.name)+', leia a aventura e depois jogue para ganhar estrelas!</div>';
PH.forEach(function(p,i){var b=S.best[bk(i)]||0;if(!unl(i)){h+='<div class="card" style="opacity:.6"><b>🔒 '+(i+1)+'. '+p.n+'</b><div class="sm">Termine a aventura '+i+' para liberar!</div></div>';return}h+='<div class="card"><b>'+p.e+' '+(i+1)+'. '+p.n+'</b> <span class="stars" style="font-size:20px">'+(b?stars(b):"☆☆☆")+'</span><div class="row"><button class="pink" style="text-align:center" onclick="study('+i+',0)">📖 Estudar</button>'+(S.studied[bk(i)]?'<button class="big" onclick="start('+i+')">🎮 Jogar</button>':'<button style="text-align:center;opacity:.6" onclick="this.textContent=\'📖 Estude primeiro!\'">🔒 Jogar</button>')+'</div></div>'});
h+='<button class="yel" onclick="resumao(0)">🏆 Resumão do Ludi</button>';show(h)}
function invite(){var u=location.href,t="Oi! Vem estudar comigo no Diário do Ludi 🦎 "+u;
if(navigator.share){navigator.share({title:"Diário do Ludi",text:"Vem estudar comigo! 🦎",url:u}).catch(function(){})}else{window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}}
function start(i){if(!unl(i)){mapa();return}if(!S.studied[bk(i)]){study(i,0);return}cur={i:i,k:0,pts:0};ask()}
function ask(){var p=PH[cur.i],q=p.q[cur.k],o=q[1].map(function(t,j){return {t:t,j:j}});
for(var a=o.length-1;a>0;a--){var b=Math.floor(Math.random()*(a+1)),x=o[a];o[a]=o[b];o[b]=x}
cur.o=o;var h='<div class="top"><button class="yel" onclick="mapa()">← Voltar</button><span>'+(cur.k+1)+'/'+p.q.length+'</span></div><div class="bar"><i style="width:'+(cur.k/p.q.length*100)+'%"></i></div><h2>'+p.e+' '+p.n+'</h2><div class="card"><b>'+q[0]+'</b></div>';
o.forEach(function(x,n){h+='<button id="o'+n+'" onclick="pick('+n+')">'+x.t+'</button>'});
show(h+'<div id="fb"></div>')}
function pick(n){var q=PH[cur.i].q[cur.k],r=cur.o[n].j===q[2];
cur.o.forEach(function(x,m){var b=document.getElementById("o"+m);b.disabled=true;if(x.j===q[2])b.className="ok"});
if(r)cur.pts++;else document.getElementById("o"+n).className="bad";
var last=cur.k+1>=PH[cur.i].q.length;
document.getElementById("fb").innerHTML='<div class="bubble">'+(r?"🎉 Isso! ":"💜 Quase! ")+q[3]+'</div><button class="big" onclick="'+(last?"fim()":"nxt()")+'">'+(last?"Ver resultado 🏁":"Próxima ➜")+'</button>'}
function nxt(){cur.k++;ask()}
function fim(){var t=PH[cur.i].q.length,f=cur.pts/t,s=f>=.8?3:f>=.5?2:1;
var first=!S.best[bk(cur.i)];if(s>(S.best[bk(cur.i)]||0))S.best[bk(cur.i)]=s;save();
show('<h1 style="text-align:center">'+(s==3?"Incrível":"Muito bem")+', '+esc(S.name)+'!</h1>'+LUDI+'<div class="card" style="text-align:center">Você acertou <b>'+cur.pts+' de '+t+'</b><div class="stars">'+stars(s)+'</div></div>'+(first&&cur.i+1<PH.length?'<div class="bubble">🔓 Nova aventura liberada: <b>'+PH[cur.i+1].n+'</b>!</div>':'')+'<button class="big" onclick="start('+cur.i+')">Jogar de novo 🔁</button><button onclick="mapa()">Voltar ao mapa 🗺️</button>')}
function study(i,k){if(!unl(i)){mapa();return}var c=ST[i];if(k>=c.length){S.studied[bk(i)]=1;save();show('<h1 style="text-align:center">Pronto, '+esc(S.name)+'! 🎉</h1>'+LUDI+'<div class="bubble">Você leu a aventura inteira! Vamos testar o que aprendeu?</div><button class="big" onclick="start('+i+')">Jogar agora 🎮</button><button onclick="mapa()">Voltar ao mapa 🗺️</button>');return}
var x=c[k],sm=LUDI.replace('class="ludi"','class="ludi" style="width:80px"');
show('<div class="top"><button class="yel" onclick="mapa()">← Voltar</button><span>'+(k+1)+'/'+c.length+'</span></div><div class="bar"><i style="width:'+((k+1)/c.length*100)+'%"></i></div><h2>'+PH[i].e+' '+PH[i].n+'</h2>'+sm+'<div class="card"><div style="font-size:46px;text-align:center">'+x[0]+'</div><h2 style="text-align:center">'+x[1]+'</h2><div style="font-size:20px">'+x[2]+'</div></div><button class="big" onclick="study('+i+','+(k+1)+')">'+(k==c.length-1?"Terminei! 🎉":"Próximo ➜")+'</button>'+(k?'<button onclick="study('+i+','+(k-1)+')">⬅ Anterior</button>':''))}
function resumao(k){if(k>=RES.length){show('<h1 style="text-align:center">Parabéns, '+esc(S.name)+'! 🎉</h1>'+LUDI+'<div class="bubble">Você leu o Resumão de '+SB.n+' inteiro! Agora mostre o que aprendeu nas aventuras.</div><button class="big" onclick="mapa()">Voltar ao mapa 🗺️</button>');return}
var t=esc(RES[k]).replace("{nome}","<b>"+esc(S.name)+"</b>");
show('<div class="top"><button class="yel" onclick="mapa()">← Voltar</button><span>'+(k+1)+'/'+RES.length+'</span></div><div class="bar"><i style="width:'+((k+1)/RES.length*100)+'%"></i></div><h2>🏆 Resumão: '+SB.n+'</h2>'+LUDI+'<div class="card" style="font-size:21px">'+t+'</div><button class="big" onclick="resumao('+(k+1)+')">'+(k==RES.length-1?"Terminar 🎉":"Próxima ➜")+'</button>'+(k?'<button onclick="resumao('+(k-1)+')">⬅ Anterior</button>':''))}
load();S.name?home():welcome();
</script>
</body>
</html>
